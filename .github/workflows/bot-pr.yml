name: Bot PR
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Short note to include in the PR body"
        required: false
        default: "bot PR test"
permissions:
  contents: write
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create branch with a small change
        run: |
          BRANCH="bot-pr/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          printf '\n\ndef bot_generated_helper(values):\n    """Sum the positive numbers in values."""\n    total = 0\n    for v in values:\n        if v > 0:\n            total += v\n    return total\n' >> dummy.py
          git commit -am "Add bot_generated_helper"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE: ${{ inputs.note }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "Bot PR: add bot_generated_helper" \
            --body "Opened by github-actions[bot] via the Bot PR workflow. Note: $NOTE"
